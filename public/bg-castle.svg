    <circle cx="880" cy="40" r="1.5"/><circle cx="1400" cy="90" r="1.4"/><circle cx="1520" cy="200" r="1.2"/><circle cx="60" cy="260" r="1.3"/>
    <circle cx="960" cy="230" r="1.1"/><circle cx="1330" cy="300" r="1"/><circle cx="420" cy="250" r="1.3"/><circle cx="1480" cy="40" r="1.7"/>
  </g>
  <!-- far mountains -->
  <path fill="url(#far)" d="M0 470 L120 380 L230 430 L330 340 L450 420 L560 360 L680 430 L780 380 L900 440 L1000 390 L1120 450 L1230 370 L1350 430 L1470 380 L1600 440 L1600 720 L0 720 Z"/>
