<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1236"/>
      <stop offset="0.45" stop-color="#3a2a6e"/>
      <stop offset="0.75" stop-color="#7a4f8f"/>
      <stop offset="1" stop-color="#c98a6a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffd98a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2452"/>
      <stop offset="1" stop-color="#1a1433"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b45"/>
      <stop offset="1" stop-color="#120d24"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15102a"/>
      <stop offset="1" stop-color="#0a0714"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a06a" stop-opacity="0"/>
      <stop offset="1" stop-color="#d9a06a" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#sky)"/>
  <circle cx="1180" cy="150" r="220" fill="url(#moon)"/>
  <circle cx="1180" cy="150" r="46" fill="#fff1c9"/>
  <g fill="#fff" opacity="0.7">
