    <path d="M820 180 L855 80 L890 180 Z"/>
    <path d="M920 250 L945 180 L970 250 Z"/>
    <rect x="560" y="315" width="20" height="18"/><rect x="600" y="315" width="20" height="18"/><rect x="640" y="315" width="20" height="18"/>
    <rect x="940" y="315" width="20" height="18"/><rect x="980" y="315" width="20" height="18"/><rect x="1020" y="315" width="20" height="18"/>
